<script>
var A=[
 ["영업시간","화~토 10:00~20:00, 일요일 11:00~18:00이에요.\n월요일은 쉬어요.",["시간","영업","몇 시","언제","열어","닫"]],

 ["주차","건물 뒤 주차장 2시간 무료예요. 카운터에서 차 번호 알려 주세요.",["주차","차"]],
 ["오시는 길","○○역 3번 출구에서 걸어서 4분, 1층 빵집 옆 2층이에요.",["위치","어디","길","주소"]]
];
var log=document.getElementById('log'),btns=document.getElementById('btns'),q=document.getElementById('q');
function add(t,c){var d=document.createElement('div');d.className=c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function ans(t){add(t,'me');var h=null;A.forEach(function(a){if(a[0]===t||a[2].some(function(k){return t.indexOf(k)>-1}))h=h||a});
 setTimeout(function(){add(h?h[1]:"그 질문은 원장님이 직접 답해 드릴게요.\n남겨 주시면 휴대폰으로 바로 알림이 가요 🙏",'mb')},450)}
A.forEach(function(a){var b=document.createElement('button');b.type='button';b.textContent=a[0];b.onclick=function(){ans(a[0])};btns.appendChild(b)});
function go(){var t=q.value.trim();if(!t)return;q.value='';ans(t)}
document.getElementById('send').onclick=go;q.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
